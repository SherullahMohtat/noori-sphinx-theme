[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "noori-sphinx-theme"
version = "0.1.0"
description = "A sleek, modern Sphinx documentation theme featuring deep tech styling, ecosystem navigation, and full RTL/LTR support."
readme = "README.md"
authors = [
    { name = "Sherullah Mohtat", email = "mohtat.sherullah@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "sphinx >=5.0",
    "jinja2 >=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
keywords = ["sphinx", "theme", "documentation", "ecosystem", "modern", "rtl", "arabic", "multilingual"]

[project.urls]
Homepage = "https://github.com/sherullahmohtat/noori-sphinx-theme"
Documentation = "https://github.com/sherullahmohtat/noori-sphinx-theme#readme"
Repository = "https://github.com/sherullahmohtat/noori-sphinx-theme"
"Issue Tracker" = "https://github.com/sherullahmohtat/noori-sphinx-theme/issues"
Changelog = "https://github.com/sherullahmohtat/noori-sphinx-theme/releases"

[project.entry-points."sphinx.html_themes"]
noori_sphinx_theme = "noori_sphinx_theme"

[tool.flit.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/noori_sphinx_theme/**/*.html",
    "src/noori_sphinx_theme/**/*.conf",
    "src/noori_sphinx_theme/static/**/*",
]
