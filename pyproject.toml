[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "noori-sphinx-theme"
version = "0.1.0"
description = "A sleek, modern Sphinx documentation theme featuring deep tech styling and ecosystem navigation."
readme = "README.md"
authors = [
    { name = "Sherullah Mohtat" }
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "sphinx >=5.0",
    "jinja2 >=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
keywords = ["sphinx", "theme", "documentation", "ecosystem", "modern", "rtl", "arabic", "multilingual"]

[project.urls]
Homepage = "https://github.com/sherullahmohtat/noori-sphinx-theme"
Repository = "https://github.com/sherullahmohtat/noori-sphinx-theme"

[project.entry-points."sphinx.html_themes"]
noori_sphinx_theme = "noori_sphinx_theme"
